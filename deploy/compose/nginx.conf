# L7 load balancer for the cluster profile (spec §4, §21): round-robin per request across three gateways.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Off: at experiment rates the access log is pure overhead, and the gateways log what matters.
    access_log off;

    upstream gateways {
        server gateway-1:8080;
        server gateway-2:8080;
        server gateway-3:8080;
        # Reuse connections to the gateways. The server is still chosen per request, so reuse
        # doesn't pin a client to one gateway; that's the difference from L4 balancing.
        keepalive 64;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # needed for upstream keep-alive
            proxy_set_header Host $host;
        }
    }
}
