# Run Flux from the images CI publishes to GHCR, with no .NET SDK and no local build:
#
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.ghcr.yml --profile single up -d
#
# Layered on top of docker-compose.yml: same services, same settings; only where the images come
# from changes. `pull` refreshes :latest; pin a commit with FLUX_TAG=sha-<full commit sha>.

x-ghcr-gateway: &ghcr-gateway
  image: ghcr.io/kar6677thik/flux-gateway:${FLUX_TAG:-latest}
  pull_policy: missing

services:
  migrate:
    <<: *ghcr-gateway
    build: !reset null
  gateway:
    <<: *ghcr-gateway
  gateway-1:
    <<: *ghcr-gateway
  gateway-2:
    <<: *ghcr-gateway
  gateway-3:
    <<: *ghcr-gateway

  payments:
    image: ghcr.io/kar6677thik/flux-backend:${FLUX_TAG:-latest}
    pull_policy: missing
    build: !reset null
  refunds:
    image: ghcr.io/kar6677thik/flux-backend:${FLUX_TAG:-latest}
    pull_policy: missing
