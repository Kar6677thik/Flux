# Local environment for Flux (spec §16).
#
#   docker compose -f deploy/compose/docker-compose.yml --profile single up --build
#
# Profiles (use single OR cluster: both serve http://localhost:8080):
#   single   one gateway                                     (M1; PostgreSQL since M2)
#   cluster  three gateways behind nginx (L7 round-robin)    (M4)
#   bench    k6 load generator, run on demand                (M4; see bench/README.md)
#
# Experiments switch behaviour from the shell, never by editing this file:
#   FLUX_ALGORITHM=RedisTokenBucket|InMemoryTokenBucket|InMemoryFixedWindow   (default InMemoryTokenBucket)
#   FLUX_REDIS_RESILIENCE=false  FLUX_REDIS_TIMEOUT_MS=5000                   (experiment E3 only)
#   FLUX_ASSUMED_INSTANCES=1                                                   (fail-open share; default 3)
#   e.g.  FLUX_ALGORITHM=RedisTokenBucket docker compose … --profile cluster up -d
#
# The backends publish no ports. From your machine the only way in is through the gateway,
# which is the same isolation the k3s NetworkPolicy gives us on the server (spec N6).
# PostgreSQL is the exception: published on 127.0.0.1:5433 only, so `dotnet run` from the IDE can use
# it. 5433 rather than 5432 so it never collides with a PostgreSQL installed natively on the laptop.
#
# Every credential in this file is a local-only dev value and is public on purpose. Real secrets
# never live in the repo (spec §17).

name: flux

# One image, two services (ADR-0007). Only payments builds it: if both did, two parallel builds
# would race to export the same tag and one would fail with "already exists".
x-backend: &backend
  image: flux-backend:local
  restart: unless-stopped

# Everything the gateways share. The image is built by `migrate`; nothing here pulls or builds.
x-gateway: &gateway
  image: flux-gateway:local
  pull_policy: never
  restart: unless-stopped
  environment:
    # Development: the dev admin token and console logs. Migration and seeding are migrate's job.
    ASPNETCORE_ENVIRONMENT: Development
    ConnectionStrings__Postgres: Host=postgres;Database=flux;Username=flux;Password=flux-local-dev
    Database__MigrateOnStartup: "false"
    Database__SeedDevData: "false"
    RateLimiting__Algorithm: ${FLUX_ALGORITHM:-InMemoryTokenBucket}
    ConnectionStrings__Redis: redis:6379
    RateLimiting__Redis__TimeoutMs: ${FLUX_REDIS_TIMEOUT_MS:-50}
    RateLimiting__Redis__UseResilience: ${FLUX_REDIS_RESILIENCE:-true}
    RateLimiting__Fallback__AssumedInstances: ${FLUX_ASSUMED_INSTANCES:-3}
    # Compose's internal DNS resolves service names, so a gateway reaches "payments:8080".
    ReverseProxy__Clusters__payments__Destinations__d1__Address: http://payments:8080
    ReverseProxy__Clusters__refunds__Destinations__d1__Address: http://refunds:8080
  depends_on:
    migrate:
      condition: service_completed_successfully
    payments:
      condition: service_started
    refunds:
      condition: service_started

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flux
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux-local-dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # "Container started" is not "database accepting connections"; the gateway waits for this.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d flux"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Shared token buckets (M5). No persistence on purpose: Redis is not a source of truth, and
  # losing it only resets limits (spec §4). Gateways don't wait for it, because they must start
  # and serve, degraded, without it (spec §9.5). 6380 on the host avoids a native Redis on 6379.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"

  payments:
    <<: *backend
    build:
      context: ../..
      dockerfile: src/Flux.Backend/Dockerfile
    environment:
      Backend__ServiceName: payments
      Backend__LatencyMs: "5"

  refunds:
    <<: *backend
    pull_policy: never   # built locally by payments; there's nothing to pull
    environment:
      Backend__ServiceName: refunds
      Backend__LatencyMs: "5"

  # Runs once and exits: apply migrations, seed the demo merchants, done. Every gateway waits for
  # it, so in the cluster profile three gateways never race to migrate one database. The same
  # "migrate before rollout" rule applies in production (spec §17). It also builds the gateway
  # image, and only it does, for the same reason payments alone builds the backend image.
  migrate:
    profiles: [single, cluster]
    build:
      context: ../..
      dockerfile: src/Flux.Gateway/Dockerfile
    image: flux-gateway:local
    command: ["--migrate-only"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=flux;Username=flux;Password=flux-local-dev
      Database__MigrateOnStartup: "true"
      Database__SeedDevData: "true"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *gateway
    profiles: [single]
    ports:
      - "8080:8080"

  gateway-1:
    <<: *gateway
    profiles: [cluster]
  gateway-2:
    <<: *gateway
    profiles: [cluster]
  gateway-3:
    <<: *gateway
    profiles: [cluster]

  # Balances per *request* (L7), so consecutive requests on one keep-alive connection still
  # rotate across the three gateways. A k8s Service balances per *connection* (L4), which can pin
  # a load generator's traffic to one pod and hide experiment E1 (spec §21).
  nginx:
    image: nginx:1.30-alpine
    profiles: [cluster]
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3

  # Load generator for the experiments: `docker compose … --profile bench run --rm k6 run /scripts/<name>.js`.
  # Capped at 2 CPUs so it can't starve the system under test of the laptop's cores (spec §15).
  k6:
    image: grafana/k6:2.3.0
    profiles: [bench]
    cpus: 2
    volumes:
      - ../../bench/k6:/scripts:ro
      - ../../bench/results:/results

volumes:
  pgdata:
