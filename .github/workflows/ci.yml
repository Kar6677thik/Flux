# Continuous integration (Field Guide §22.1): every push and pull request is built and tested on a
# fresh, disposable Ubuntu machine, so "works on my laptop" can't sneak into main.
# On main it also publishes both images to GHCR (M7); there is no deploy step (ADR-0011).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch makes older runs pointless; cancel them to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (Field Guide §22.24): this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json      # same SDK as local development
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  images:
    name: Build container images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Least privilege per job: only this job may write packages, and it only pushes from main.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: Gateway
            image: flux-gateway
          - service: Backend
            image: flux-backend
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Registry paths must be lowercase; the account name isn't.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every push and PR proves the Dockerfiles build. Only main publishes, tagged with the
      # commit (immutable: "exactly this code") and latest (what the demo compose file pulls).
      - name: Build Flux.${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Flux.${{ matrix.service }}/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Flux ${{ matrix.service }} (multi-tenant API gateway and rate limiter)
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
